services:
  - type: web
    name: kindloop-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        value: https://kindloop-one.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: MONGO_ATLAS_USER
        sync: false
      - key: MONGO_ATLAS_PASSWORD
        sync: false
      - key: MONGO_ATLAS_HOST
        sync: false
      - key: MONGO_ATLAS_DB
        value: kindloop
      - key: EMAIL_FROM
        sync: false
      - key: MAIL_WEBHOOK_URL
        sync: false
      - key: MAIL_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: AI_MICROSERVICE_URL
        sync: false
